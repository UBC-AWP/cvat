# Publishes docker image, pinning actions to a commit SHA,
# and updating most recently built image with the latest tag.
# Can be triggered by either pushing a commit that changes the UI source,
# or manually dispatching the workflow.

name: Build and Push CVAT UI

on:
  push:
    branches: [develop]
    paths:
      - "cvat-ui/**"
      - "cvat-core/**"
      - "cvat-canvas/**"
      - "cvat-canvas3d/**"
      - "cvat-data/**"
      - "Dockerfile.ui"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: skysheng7/cvat-ui
          tags: |
            type=raw,value={{sha}},enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update docker-compose.yml with new image tag
        if: success()
        run: |
          sed -i "s|image: skysheng7/cvat-ui:.*|image: skysheng7/cvat-ui:${{ steps.meta.outputs.version }}|" docker-compose.yml

      - name: Commit and push updated docker-compose.yml
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "Update docker-compose.yml with new image tag"
          git push
